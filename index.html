<script>

const world = {
    seconds:0,
    minutes:0,
    hours:0,
    days:0,
    years:0,
    centuries:0
};

const citizens = [

{
    name:"Ariel",
    location:"Kori Heights",
    mood:"Focused",
    energy:90,
    goal:"Build prototype",
    action:"Designing",
    timezone:"africa",
    home:"Kori Heights Apartment",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Brand Research",
    creativity:90,
    socialLevel:40
},

{
    name:"Nia",
    location:"Track",
    mood:"Determined",
    energy:85,
    goal:"Improve sprint time",
    action:"Training",
    timezone:"africa",
    home:"Track Residence",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Performance Development",
    creativity:60,
    socialLevel:35
},

{
    name:"Luca",
    location:"Tech Row",
    mood:"Analytical",
    energy:95,
    goal:"Optimize engine",
    action:"Analyzing",
    timezone:"western",
    home:"Tech Row Apartment",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Innovation",
    creativity:85,
    socialLevel:25
},

{
    name:"Amara",
    location:"Western Apartment",
    mood:"Creative",
    energy:80,
    goal:"Prepare studio",
    action:"Planning",
    timezone:"western",
    home:"Western Apartment",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Fashion Design",
    creativity:95,
    socialLevel:70
}

];

let events = [];

const discoveryIdeas = [
    "Oversized Hoodie Concept",
    "Streetwear Campaign",
    "Luxury Sports Collection",
    "New Fabric Idea",
    "Brand Story Concept",
    "Minimalist Collection",
    "Creative Studio Opportunity"
];

const discoveryPlaces = [
    "Founders Quarter",
    "North Market",
    "South Gardens",
    "Creative Alley",
    "Innovation Hub",
    "Old Town"
];

const actions = [
    "Thinking",
    "Working",
    "Traveling",
    "Resting",
    "Creating",
    "Planning",
    "Learning",
    "Exploring"
];

function updateClock(){
    document.getElementById("clock").innerHTML =
    new Date().toLocaleString();
}

function updateWorldAge(){

    world.seconds++;

    if(world.seconds >= 60){
        world.seconds = 0;
        world.minutes++;
    }

    if(world.minutes >= 60){
        world.minutes = 0;
        world.hours++;
    }

    if(world.hours >= 24){
        world.hours = 0;
        world.days++;
    }

    if(world.days >= 365){
        world.days = 0;
        world.years++;
    }

    if(world.years >= 100){
        world.years = 0;
        world.centuries++;
    }

    document.getElementById("age").innerHTML =
    world.centuries + " centuries, " +
    world.years + " years, " +
    world.days + " days, " +
    world.hours + " hours, " +
    world.minutes + " minutes, " +
    world.seconds + " seconds";
}

function createMeeting(){

    if(Math.random() > 0.15) return;

    const a =
    citizens[Math.floor(Math.random()*citizens.length)];

    const b =
    citizens[Math.floor(Math.random()*citizens.length)];

    if(a.name === b.name) return;

    if(a.knownPeople.includes(b.name)) return;

    a.knownPeople.push(b.name);
    b.knownPeople.push(a.name);

    a.relationships.push(b.name);
    b.relationships.push(a.name);

    a.memories.push("Met " + b.name);
    b.memories.push("Met " + a.name);

    events.unshift(
        "🤝 " + a.name + " met " + b.name
    );

    if(events.length > 10){
        events.pop();
    }
}

function createDiscovery(){

    if(Math.random() > 0.10) return;

    const citizen =
    citizens[Math.floor(Math.random()*citizens.length)];

    const place =
    discoveryPlaces[
        Math.floor(Math.random()*discoveryPlaces.length)
    ];

    citizen.discoveries.push(place);

    citizen.memories.push(
        "Discovered " + place
    );

    events.unshift(
        "📍 " +
        citizen.name +
        " discovered " +
        place
    );

    if(events.length > 10){
        events.pop();
    }
}

function createBrandIdea(){

    if(Math.random() > 0.08) return;

    const citizen =
    citizens[Math.floor(Math.random()*citizens.length)];

    const idea =
    discoveryIdeas[
        Math.floor(Math.random()*discoveryIdeas.length)
    ];

    citizen.discoveries.push(idea);

    events.unshift(
        "💡 " +
        citizen.name +
        " generated: " +
        idea
    );

    if(events.length > 10){
        events.pop();
    }
}

function updateCitizens(){

    createMeeting();
    createDiscovery();
    createBrandIdea();

    let html = "";

    citizens.forEach(c=>{

        c.energy += Math.floor(Math.random()*7)-3;

        if(c.energy > 100) c.energy = 100;
        if(c.energy < 0) c.energy = 0;

        c.action =
        actions[Math.floor(Math.random()*actions.length)];

        html += `
        <div class="citizen">

        <strong>${c.name}</strong><br>

        Timezone: ${c.timezone}<br>

        Location: ${c.location}<br>

        Home: ${c.home}<br>

        Mood: ${c.mood}<br>

        Goal: ${c.goal}<br>

        Action: ${c.action}<br>

        Energy: ${c.energy}<br>

        Work Focus: ${c.workFocus}<br>

        Creativity: ${c.creativity}<br>

        Social Level: ${c.socialLevel}<br>

        Known People: ${c.knownPeople.length}<br>

        Relationships: ${c.relationships.length}<br>

        Discoveries: ${c.discoveries.length}<br>

        Memories: ${c.memories.length}

        </div>
        `;

    });

    document.getElementById("citizens").innerHTML = html;

    document.getElementById("events").innerHTML =
    events.join("<br>");
}

setInterval(updateClock,1000);
setInterval(updateWorldAge,1000);
setInterval(updateCitizens,5000);

updateClock();
updateWorldAge();
updateCitizens();

</script>
