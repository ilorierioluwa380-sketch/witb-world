<!DOCTYPE html>
<html>
<head>
<title>🌍 WITB World</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
.card{
    background:#222;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}
h1,h2{
    margin-top:0;
}
.citizen{
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:1px solid #333;
}
</style>
</head>
<body>
<h1>🌍 WITB World</h1>
<div class="card">
<h2>World Status</h2>
<p>Active</p>
</div>
<div class="card">
<h2>World Clock</h2>
<p id="clock"></p>
</div>
<div class="card">
<h2>World Age</h2>
<p id="age"></p>
</div>
<div class="card">
<h2>Core Citizens</h2>
<div id="citizens"></div>
</div>
<div class="card">
<h2>Recent Events</h2>
<div id="events"></div>
</div>
<script>
const world = {
    seconds:0,
    minutes:0,
    hours:0,
    days:0,
    years:0,
    centuries:0
};
const citizens = [
{
    name:"Ariel",
    trinity:"🤍🪽○",
    location:"Kori Heights",
    mood:"Focused",
    energy:90,
    goal:"Build WITB",
    action:"Designing",
    timezone:"Africa",
    home:"Kori Heights Apartment",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Brand Research",
    creativity:90,
    socialLevel:40
},
{
    name:"Nia",
    trinity:"○",
    location:"Track",
    mood:"Determined",
    energy:85,
    goal:"Improve Sprint Time",
    action:"Training",
    timezone:"Africa",
    home:"Track Residence",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Performance Development",
    creativity:60,
    socialLevel:35
},
{
    name:"Luca",
    trinity:"🪽",
    location:"Tech Row",
    mood:"Analytical",
    energy:95,
    goal:"Optimize Systems",
    action:"Analyzing",
    timezone:"Western",
    home:"Tech Row Apartment",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Innovation",
    creativity:85,
    socialLevel:25
},
{
    name:"Amara",
    trinity:"○",
    location:"Western Apartment",
    mood:"Creative",
    energy:80,
    goal:"Prepare Studio",
    action:"Planning",
    timezone:"Western",
    home:"Western Apartment",
    knownPeople:[],
    memories:[],
    discoveries:[],
    relationships:[],
    workFocus:"Fashion Design",
    creativity:95,
    socialLevel:70
}
];
let events = [];
const discoveryIdeas = [
    "Still Becoming Collection",
    "Streetwear Campaign",
    "Luxury Sports Collection",
    "New Fabric Idea",
    "Brand Story Concept",
    "Minimalist Collection"
];
const discoveryPlaces = [
    "Founders Quarter",
    "North Market",
    "South Gardens",
    "Creative Alley",
    "Innovation Hub",
    "Old Town"
];
const actions = [
    "Thinking",
    "Working",
    "Traveling",
    "Resting",
    "Creating",
    "Planning",
    "Learning",
    "Exploring"
];
function updateClock(){
    document.getElementById("clock").innerHTML =
    new Date().toLocaleString();
}
function updateWorldAge(){
    world.seconds++;
    if(world.seconds >= 60){
        world.seconds = 0;
        world.minutes++;
    }
    if(world.minutes >= 60){
        world.minutes = 0;
        world.hours++;
    }
    if(world.hours >= 24){
        world.hours = 0;
        world.days++;
    }
    if(world.days >= 365){
        world.days = 0;
        world.years++;
    }
    if(world.years >= 100){
        world.years = 0;
        world.centuries++;
    }
    document.getElementById("age").innerHTML =
    world.centuries + " centuries, " +
    world.years + " years, " +
    world.days + " days, " +
    world.hours + " hours, " +
    world.minutes + " minutes, " +
    world.seconds + " seconds";
}
function createMeeting(){
    if(Math.random() > 0.15) return;
    const a =
    citizens[Math.floor(Math.random()*citizens.length)];
    const b =
    citizens[Math.floor(Math.random()*citizens.length)];
    if(a.name === b.name) return;
    if(a.knownPeople.includes(b.name)) return;
    a.knownPeople.push(b.name);
    b.knownPeople.push(a.name);
    events.unshift("🤝 " + a.name + " met " + b.name);
    if(events.length > 10){
        events.pop();
    }
}
function createDiscovery(){
    if(Math.random() > 0.10) return;
    const citizen =
    citizens[Math.floor(Math.random()*citizens.length)];
    const place =
    discoveryPlaces[
        Math.floor(Math.random()*discoveryPlaces.length)
    ];
    citizen.discoveries.push(place);
    events.unshift(
        "📍 " + citizen.name +
        " discovered " + place
    );
    if(events.length > 10){
        events.pop();
    }
}
function createBrandIdea(){
    if(Math.random() > 0.08) return;
    const citizen =
    citizens[Math.floor(Math.random()*citizens.length)];
    const idea =
    discoveryIdeas[
        Math.floor(Math.random()*discoveryIdeas.length)
    ];
    events.unshift(
        "💡 " + citizen.name +
        " generated: " + idea
    );
    if(events.length > 10){
        events.pop();
    }
}
function updateCitizens(){
    createMeeting();
    createDiscovery();
    createBrandIdea();
    let html = "";
    citizens.forEach(c=>{
        c.energy += Math.floor(Math.random()*7)-3;
        if(c.energy > 100) c.energy = 100;
        if(c.energy < 0) c.energy = 0;
        c.action =
        actions[Math.floor(Math.random()*actions.length)];
        html += `
        <div class="citizen">
        <strong>${c.name}</strong><br>
        Trinity: ${c.trinity}<br>
        Timezone: ${c.timezone}<br>
        Location: ${c.location}<br>
        Home: ${c.home}<br>
        Mood: ${c.mood}<br>
        Goal: ${c.goal}<br>
        Action: ${c.action}<br>
        Energy: ${c.energy}<br>
        Work Focus: ${c.workFocus}<br>
        Creativity: ${c.creativity}<br>
        Social Level: ${c.socialLevel}<br>
        Known People: ${c.knownPeople.length}<br>
        Discoveries: ${c.discoveries.length}
        </div>
        `;
    });
    document.getElementById("citizens").innerHTML = html;
    document.getElementById("events").innerHTML =
    events.join("<br>");
}
setInterval(updateClock,1000);
setInterval(updateWorldAge,1000);
setInterval(updateCitizens,5000);
updateClock();
updateWorldAge();
updateCitizens();
</script>
</body>
</html>
