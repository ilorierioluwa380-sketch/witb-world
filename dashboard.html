<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WITB World Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050b14;
    color:white;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    font-size:3rem;
    color:#25ffd0;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:25px;
    margin:20px 0;
}

.stat{
    font-size:3rem;
    color:#25ffd0;
    font-weight:bold;
}

.enter-card{
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:20px;
    font-size:1.1rem;
    color:white;
    background:linear-gradient(90deg,#00d4ff,#00ff88);
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 WITB WORLD</h1>

<p>A Persistent World Powered By Eternal Motion</p>

<div class="card">
<h2>Welcome Founder</h2>

<p>
Every citizen matters.
Every discovery changes history.
Every action becomes part of the world.
</p>
</div>

<div class="card">
<div class="stat" id="citizens">4</div>
Citizens
</div>

<div class="card">
<div class="stat" id="districts">7</div>
Districts
</div>

<div class="card">
<div class="stat" id="communities">1</div>
Communities
</div>

<div class="card">
<div class="stat">127</div>
World Year
</div>

<div class="enter-card">
<button>
🚀 WORLD SYSTEM ACTIVE
</button>
</div>

</div>

</body>
</html>
